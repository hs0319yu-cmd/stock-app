<script>

let DATA = [];

// 端末ごとの入力数量を保存し、同時にDBにも更新を送信する
const LOCAL_QTY_KEY = "stock_app_local_quantities_v1";
let LOCAL_QTY = {};

function formatStock(value){
  const n = Number(value);
  return Number.isFinite(n) ? Math.max(0, Math.floor(n)) : 0;
}

function loadLocalQuantities(){
  try {
    const saved = localStorage.getItem(LOCAL_QTY_KEY);
    LOCAL_QTY = saved ? JSON.parse(saved) : {};
    if (!LOCAL_QTY || typeof LOCAL_QTY !== "object" || Array.isArray(LOCAL_QTY)) {
      LOCAL_QTY = {};
    }
  } catch (err) {
    console.warn("端末数量の読み込みに失敗:", err);
    LOCAL_QTY = {};
  }
}

function saveLocalQuantities(){
  try {
    localStorage.setItem(LOCAL_QTY_KEY, JSON.stringify(LOCAL_QTY));
  } catch (err) {
    console.error("端末数量の保存に失敗:", err);
    alert("端末に数量を保存できませんでした。端末の空き容量やプライベートブラウズ設定を確認してください。");
  }
}

function getLocalQuantity(row){
  return formatStock(LOCAL_QTY[String(row)] || 0);
}

const stockWritePending = new Set();

function resetLocalQuantities(){
  if (!confirm("この端末に保存されている全商品の入力数量を0にリセットします。よろしいですか？")) return;
  LOCAL_QTY = {};
  saveLocalQuantities();
  render();
}

let LAST_Y = 0;

// ←ここに置く
function restoreScroll(){
  window.scrollTo(0, LAST_Y);
}

function onFocusQty(row){
  LAST_Y = window.scrollY;
}

 const GAS_URL =
"https://script.google.com/macros/s/AKfycbwYBYPrPt6_-F6KJ0fBAl5mfRWzzvEi976jYX4-16Bw3NSbhtOVkgnTy__vqVPrdE8g/exec";

// QRで呼び出した検索文字列
let QR_SEARCH = "";

// QR解除
function clearQR(){

QR_SEARCH = "";

document.getElementById(
"cameraBtn"
).innerText =
"📷 QR読み込み";

}

// ★ここに全部まとめる（最上部）
function normalize(str){
  return String(str || "")
    .toLowerCase()
    .replace(/[^\p{L}\p{N}]+/gu, "")
    .replace(/[ぁ-ん]/g, s =>
      String.fromCharCode(s.charCodeAt(0) + 0x60)
    );
}

function tokenize(str){
  return normalize(str).match(/[\p{L}\p{N}]+/gu) || [];
}

function score(itemText, keyword){

  const text = normalize(itemText);
  const key = normalize(keyword);

  let score = 0;

  if (!key) return 1;

  // ① 完全一致
  if (text.includes(key)) {
    return 100;
  }

  // ② スライド部分一致（Amazonの核心）
  for (let i = 0; i < key.length - 1; i++) {

    const part = key.slice(i, i + 2); // 2文字単位

    if (text.includes(part)) {
      score += 10;
    }
  }

  // ③ 1文字でもヒット
  for (let c of key) {
    if (text.includes(c)) {
      score += 2;
    }
  }

  return score;
}
// =====================
// 商品select更新
// =====================
function updateProducts(){

const supplier =
document.getElementById(
"supplier"
).value;

// 商品一覧生成
const names =
[
...new Set(

DATA
.filter(item=>

!supplier ||

item.supplier === supplier

)
.map(item=>

item.name

)
.filter(Boolean)

)
];

document.getElementById(
"jump"
).innerHTML =

'<option value="">商品</option>' +

names
.map(v=>

`<option value="${v}">
${v}
</option>`

)
.join("");

}

function adjustHeader(){

  const topbar =
    document.querySelector(".topbar");

  const h =
    topbar.getBoundingClientRect().height;

  document.getElementById("list")
    .style.marginTop =
      (h + 25) + "px";
}
window.addEventListener(
  "load",
  adjustHeader
);

window.addEventListener(
  "resize",
  adjustHeader
);
// =====================
// データ取得
// =====================
async function load(){

const res =
await fetch(
GAS_URL + "?api=1"
);

DATA =
await res.json();

/* 仕入先一覧 */
const supplierEl =
document.getElementById(
"supplier"
);

supplierEl.innerHTML =

'<option value="">全商品検索</option>' +

[
...new Set(
DATA
.map(v=>v.supplier)
.filter(Boolean)
)
]
.map(v=>

`<option value="${v}">
${v}
</option>`

)
.join("");

/* 商品一覧更新 */
updateProducts();

/* 初回表示 */
render();

/* ★ヘッダー高さ調整 */
setTimeout(adjustHeader,100);


}
// =====================
// 描画
// =====================
function render(){

  const supplier = document.getElementById("supplier").value;
  const product  = document.getElementById("jump").value;
  const keyword  = document.getElementById("keyword").value;

  let list = [];

  DATA.forEach(item => {

    if (supplier && item.supplier !== supplier) return;
    if (product && item.name !== product) return;

    
// QR表示中なら
// supplier|name|type 一致
if(QR_SEARCH){

const qr =
normalize(QR_SEARCH);

const target =
normalize(
(item.supplier || "") +
"|" +
(item.name || "") +
"|" +
(item.type || "")
);

console.log(
"QR=",
qr
);

console.log(
"TARGET=",
target
);

if(
target !== qr
){
return;
}

}


   const text = normalize(
  item.supplier +
  item.name +
  item.type +
  item.size +
  item.code
);

    const s = keyword ? score(text, keyword) : 1;

    if (keyword && s === 0) return;

    list.push({ item, score: s });
  });

  // ★重要：スコア順（Amazonの本体）
  list.sort((a,b) => b.score - a.score);

  let html = "";

  list.forEach(obj => {

    const item = obj.item;

  html += `
  <div class="card" id="item_${item.row}">

    <div class="name">${item.name}</div>

    <div class="type">${item.type || ""}</div>

    <div class="size">${item.size || ""}</div>

   <div class="stock" id="s${item.row}">
  <span class="stock-label">端末入力数</span> ${getLocalQuantity(item.row)}
</div>

  <input
type="tel"
id="q${item.row}"
class="qty"
placeholder="${item.supplier || '仕入先なし'}"
onfocus="onFocusQty(${item.row})"
onblur="setTimeout(restoreScroll, 0)">


   <div class="btns">
  <button class="plus" onclick="chg(${item.row},1)">＋</button>
  <button class="minus" onclick="chg(${item.row},-1)">－</button>
</div>

  </div>
`;
  });

 document.getElementById("list").innerHTML = html;

/* ★ヘッダー高さ再計算 */
setTimeout(adjustHeader,0);
}

/* 検索窓のキーワード検索を解除 */
let searchTimer;

function clearKeywordSearch(){
  clearTimeout(searchTimer);
  const keywordEl = document.getElementById("keyword");
  if (keywordEl) keywordEl.value = "";
  QR_SEARCH = "";
  render();
}

function searchRender(){

  clearTimeout(searchTimer);

  searchTimer = setTimeout(()=>{

    const keyword =
      document.getElementById("keyword").value.trim();

    // ★検索開始したら「全体検索に戻す」
    if(keyword){

      document.getElementById("supplier").value = "";
      document.getElementById("jump").value = "";

      updateProducts();
    }

    render();
    window.scrollTo(0,0);

  },100);

}

// =====================
// 在庫変更
// =====================
async function chg(row,mode){
  const box = document.getElementById("q"+row);
  const qty = Math.floor(Number(box && box.value));
  if(!Number.isFinite(qty) || qty <= 0) {
    alert("数量を入力してください。");
    return;
  }

  const rowKey = String(row);
  // 同じ端末から同じ商品への二重送信を防止
  if (stockWritePending.has(rowKey)) return;
  stockWritePending.add(rowKey);

  const diff = mode > 0 ? qty : -qty;
  const previous = getLocalQuantity(row);
  const next = Math.max(0, previous + diff);
  const stockEl = document.getElementById("s"+row);
  const card = document.getElementById("item_"+row);
  const buttons = card ? card.querySelectorAll(".btns button") : [];

  // 先に端末画面へ反映し、アプリを閉じても残るよう即保存
  LOCAL_QTY[rowKey] = next;
  saveLocalQuantities();
  if (stockEl) {
    stockEl.innerHTML = '<span class="stock-label">端末入力数</span> ' + next;
  }
  buttons.forEach(btn => { btn.disabled = true; btn.style.opacity = "0.55"; });

  try {
    // DBには差分だけ送信。DB全件の再取得はしないため通信負荷を抑える
    const response = await fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify({ row: Number(row), diff: diff })
    });
    const result = await response.json();
    if (!response.ok || !result || result.ok !== true ||
        Number(result.row) !== Number(row) ||
        !Number.isFinite(Number(result.stock))) {
      throw new Error((result && result.error) || "DBから保存完了の応答がありません");
    }

    // DB確定値は端末入力数の表示には混ぜず、端末ごとの集計表示を維持
    box.value = "";
    box.blur();
  } catch (err) {
    console.error("DB在庫更新エラー:", err);
    // 保存失敗時は端末表示も元に戻し、二重計上を避ける
    LOCAL_QTY[rowKey] = previous;
    saveLocalQuantities();
    if (stockEl) {
      stockEl.innerHTML = '<span class="stock-label">端末入力数</span> ' + previous;
    }
    alert("DBへの保存を確認できませんでした。通信状態とDBの在庫を確認してください。数量は元に戻しました。");
  } finally {
    stockWritePending.delete(rowKey);
    buttons.forEach(btn => { btn.disabled = false; btn.style.opacity = ""; });
  }
}

// 上へ

/* =====================
   QR読取：在庫アプリ内でライブスキャン
   Safari / iPhoneホーム画面アプリ対応
   ===================== */

let liveQrScanner = null;
let qrCameraOverlay = null;
let qrStarting = false;
let qrSessionId = 0;

async function closeQRScanner() {
  // セッション番号を進め、起動処理中であっても完了後に必ず停止させる
  qrSessionId++;
  qrStarting = false;

  const scanner = liveQrScanner;
  liveQrScanner = null;

  if (scanner) {
    try {
      // stop() が完了するまでカメラ画面を取り除かない
      await scanner.stop();
    } catch (e) {
      console.warn("QRカメラ停止:", e);
    }
    try { scanner.clear(); } catch (e) {}
  }

  // ライブラリ側の停止が遅れた場合に備え、残っている video track も停止
  document.querySelectorAll("#qrCameraOverlay video").forEach(video => {
    const stream = video.srcObject;
    if (stream && stream.getTracks) {
      stream.getTracks().forEach(track => {
        try { track.stop(); } catch (e) {}
      });
    }
    try { video.pause(); } catch (e) {}
    video.srcObject = null;
  });

  if (qrCameraOverlay) {
    qrCameraOverlay.remove();
    qrCameraOverlay = null;
  }
  const cameraBtn = document.getElementById("cameraBtn");
  if (cameraBtn) cameraBtn.innerText = "📷 QR読み込み";
}

async function scanQR() {
  const cameraBtn = document.getElementById("cameraBtn");

  if (qrStarting || liveQrScanner) return;
  if (typeof Html5Qrcode === "undefined") {
    alert("QR読み取りライブラリを読み込めませんでした。通信状態を確認して、もう一度お試しください。");
    return;
  }

  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert("この画面ではカメラを起動できません。https:// で開いていることを確認してください。");
    return;
  }

  qrStarting = true;
  const mySession = ++qrSessionId;
  cameraBtn.innerText = "📷 カメラ起動中…";

  qrCameraOverlay = document.createElement("div");
  qrCameraOverlay.id = "qrCameraOverlay";
  qrCameraOverlay.style.cssText =
    "position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.94);" +
    "display:flex;flex-direction:column;align-items:center;justify-content:center;" +
    "padding:18px;box-sizing:border-box;";

  const title = document.createElement("div");
  title.textContent = "QRコードを枠内に映してください";
  title.style.cssText =
    "color:white;font-size:18px;font-weight:bold;text-align:center;margin:0 0 14px;";

  const reader = document.createElement("div");
  reader.id = "qrLiveReader";
  reader.style.cssText =
    "width:min(92vw,420px);min-height:260px;background:#111;border-radius:12px;overflow:hidden;";

  const closeBtn = document.createElement("button");
  closeBtn.type = "button";
  closeBtn.textContent = "カメラを完全に閉じる";
  closeBtn.style.cssText =
    "margin-top:18px;min-height:52px;width:min(92vw,420px);border:0;border-radius:10px;" +
    "background:#ef4444;color:white;font-size:18px;font-weight:bold;";
  closeBtn.addEventListener("click", () => { closeQRScanner(); });

  qrCameraOverlay.appendChild(title);
  qrCameraOverlay.appendChild(reader);
  qrCameraOverlay.appendChild(closeBtn);
  document.body.appendChild(qrCameraOverlay);

  let scanner = null;
  try {
    scanner = new Html5Qrcode("qrLiveReader");
    liveQrScanner = scanner;

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: (w, h) => {
          const size = Math.floor(Math.min(w, h, 280));
          return { width: size, height: size };
        },
        aspectRatio: 1.0
      },
      async (decodedText) => {
        if (mySession !== qrSessionId || liveQrScanner !== scanner) return;
        const decoded = String(decodedText || "").trim();
        if (!decoded) return;

        await closeQRScanner();

        QR_SEARCH = decoded;
        document.getElementById("supplier").value = "";
        document.getElementById("jump").value = "";
        document.getElementById("keyword").value = "";
        updateProducts();
        render();
        window.scrollTo(0, 0);
      },
      () => {}
    );

    // 起動中に閉じる操作が行われた場合、start完了直後に再停止する
    if (mySession !== qrSessionId || !qrCameraOverlay) {
      try { await scanner.stop(); } catch (e) {}
      try { scanner.clear(); } catch (e) {}
      if (liveQrScanner === scanner) liveQrScanner = null;
      return;
    }

    qrStarting = false;
    cameraBtn.innerText = "📷 読み取り中（下のボタンで完全終了）";
  } catch (err) {
    if (mySession === qrSessionId) {
      console.error("QR camera start error:", err);
      await closeQRScanner();
      const message = String(err && (err.message || err.name) || err);
      if (/NotAllowedError|PermissionDeniedError|denied|permission/i.test(message)) {
        alert("カメラを使用できませんでした。iPhoneの設定で、このWebアプリのカメラ使用を許可してください。");
      } else if (/NotFoundError|DevicesNotFoundError/i.test(message)) {
        alert("利用できるカメラが見つかりませんでした。");
      } else {
        alert("カメラを起動できませんでした。\\n" + message + "\\n在庫アプリを閉じて開き直し、もう一度お試しください。");
      }
    } else if (scanner) {
      try { await scanner.stop(); } catch (e) {}
      try { scanner.clear(); } catch (e) {}
    }
  }
}

// 起動
loadLocalQuantities();
load();


</script>
