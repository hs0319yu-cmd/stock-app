<script>

let DATA = [];

let LAST_Y = 0;

// ←ここに置く
function restoreScroll(){
  window.scrollTo(0, LAST_Y);
}

function onFocusQty(row){
  LAST_Y = window.scrollY;
}

 const GAS_URL =
"https://script.google.com/macros/s/AKfycbwYBYPrPt6_-F6KJ0fBAl5mfRWzzvEi976jYX4-16Bw3NSbhtOVkgnTy__vqVPrdE8g/exec";

// GitHub PagesからManusのAIを直接呼ばず、既存GASを安全な中継先として使う。
// GAS側で api=ai-ocr を実装していない場合は、従来のTesseract OCRへ戻る。
const AI_OCR_URL = GAS_URL + "?api=ai-ocr";

// QRで呼び出した検索文字列
let QR_SEARCH = "";

// QR解除
function clearQR(){

QR_SEARCH = "";

document.getElementById(
"cameraBtn"
).innerText =
"📷 QR読み込み";

}

// ★ここに全部まとめる（最上部）
function normalize(str){
  return String(str || "")
    .toLowerCase()
    .replace(/[^\p{L}\p{N}]+/gu, "")
    .replace(/[ぁ-ん]/g, s =>
      String.fromCharCode(s.charCodeAt(0) + 0x60)
    );
}

function tokenize(str){
  return normalize(str).match(/[\p{L}\p{N}]+/gu) || [];
}

function score(itemText, keyword){

  const text = normalize(itemText);
  const key = normalize(keyword);

  let score = 0;

  if (!key) return 1;

  // ① 完全一致
  if (text.includes(key)) {
    return 100;
  }

  // ② スライド部分一致（Amazonの核心）
  for (let i = 0; i < key.length - 1; i++) {

    const part = key.slice(i, i + 2); // 2文字単位

    if (text.includes(part)) {
      score += 10;
    }
  }

  // ③ 1文字でもヒット
  for (let c of key) {
    if (text.includes(c)) {
      score += 2;
    }
  }

  return score;
}
// =====================
// 商品select更新
// =====================
function updateProducts(){

const supplier =
document.getElementById(
"supplier"
).value;

// 商品一覧生成
const names =
[

`<option value="${v}">
${v}
</option>`

// =====================
// データ取得
// =====================
async function load(){

const res =
await fetch(
GAS_URL + "?api=1"
);

DATA =
await res.json();

/* 仕入先一覧 */
const supplierEl =
document.getElementById(
"supplier"
);

supplierEl.innerHTML =

'<option value="">全商品検索</option>' +

[
...new Set(
DATA
.map(v=>v.supplier)
.filter(Boolean)
)
]
.map(v=>

`<option value="${v}">
${v}
</option>`

)
.join("");

/* 商品一覧更新 */
updateProducts();

/* 初回表示 */
render();

/* ★ヘッダー高さ調整 */
setTimeout(adjustHeader,100);

}
// =====================
// 描画
// =====================
function render(){

  const supplier = document.getElementById("supplier").value;
  const product  = document.getElementById("jump").value;
  const keyword  = document.getElementById("keyword").value;

  let list = [];

  DATA.forEach(item => {

    if (supplier && item.supplier !== supplier) return;
    if (product && item.name !== product) return;

    
// QR表示中なら
// supplier|name|type 一致
if(QR_SEARCH){

const qr =
normalize(QR_SEARCH);

const target =
normalize(
(item.supplier || "") +
"|" +
(item.name || "") +
"|" +
(item.type || "")
);

console.log(
"QR=",
qr
);

console.log(
"TARGET=",
target
);

if(
target !== qr
){
return;
}

}


   const text = normalize(
  item.supplier +
  item.name +
  item.type +
  item.size +
  item.code
);

    const s = keyword ? score(text, keyword) : 1;

    if (keyword && s === 0) return;

    list.push({ item, score: s });
  });

  // ★重要：スコア順（Amazonの本体）
  list.sort((a,b) => b.score - a.score);

  let html = "";

  list.forEach(obj => {

    const item = obj.item;

  html += `
  <div class="card" id="item_${item.row}">

    <div class="name">${item.name}</div>

    <div class="type">${item.type || ""}</div>

    <div class="size">${item.size || ""}</div>

   <div class="stock" id="s${item.row}">
  0
</div>

  <input
type="tel"
id="q${item.row}"
class="qty"
placeholder="${item.supplier || '仕入先なし'}"
onfocus="onFocusQty(${item.row})"
onblur="setTimeout(restoreScroll, 0)">


   <div class="btns">
  <button class="plus" onclick="chg(${item.row},1)">＋</button>
  <button class="minus" onclick="chg(${item.row},-1)">－</button>
</div>

  </div>
`;
  });

 document.getElementById("list").innerHTML = html;

/* ★ヘッダー高さ再計算 */
setTimeout(adjustHeader,0);
}

/* 検索窓のキーワード検索を解除 */

function clearKeywordSearch(){
  clearTimeout(searchTimer);
  const keywordEl = document.getElementById("keyword");
  if (keywordEl) keywordEl.value = "";
  QR_SEARCH = "";
  render();
}

function searchRender(){

  clearTimeout(searchTimer);

  searchTimer = setTimeout(()=>{

    const keyword =
      document.getElementById("keyword").value.trim();

    // ★検索開始したら「全体検索に戻す」
    if(keyword){

      document.getElementById("supplier").value = "";
      document.getElementById("jump").value = "";

      updateProducts();
    }

    render();
    window.scrollTo(0,0);

  },100);

}

// =====================
// 在庫変更
// =====================
async function chg(row,mode){

  const box = document.getElementById("q"+row);
  const qty = Number(box.value);

  if(!qty || qty <= 0) return;

  const diff = mode > 0 ? qty : -qty;

  const stockEl = document.getElementById("s"+row);

  let current = Number(stockEl.innerText) || 0;

  current += diff;
  if(current < 0) current = 0;

  stockEl.innerText = current;

  box.value = "";

  await fetch(GAS_URL,{
    method:"POST",
    body:JSON.stringify({ row, diff })
  });

  box.blur();
}

/* =====================
   QR読取：在庫アプリ内でライブスキャン
   Safari / iPhoneホーム画面アプリ対応
   ===================== */

let liveQrScanner = null;
let qrCameraOverlay = null;
let qrStarting = false;

function closeQRScanner() {
  if (liveQrScanner) {
    const scanner = liveQrScanner;
    liveQrScanner = null;
    scanner.stop().catch(() => {}).finally(() => {
      try { scanner.clear(); } catch (e) {}
    });
  }
  if (qrCameraOverlay) {
    qrCameraOverlay.remove();
    qrCameraOverlay = null;
  }
  qrStarting = false;
  const cameraBtn = document.getElementById("cameraBtn");
  if (cameraBtn) cameraBtn.innerText = "📷 QR読み込み";
}

async function scanQR() {
  const cameraBtn = document.getElementById("cameraBtn");

  if (qrStarting || liveQrScanner) return;
  if (typeof Html5Qrcode === "undefined") {
    alert("QR読み取りライブラリを読み込めませんでした。通信状態を確認して、もう一度お試しください。");
    return;
  }

  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert("この画面ではカメラを起動できません。https:// で開いていることを確認してください。");
    return;
  }

  qrStarting = true;
  cameraBtn.innerText = "📷 カメラ起動中…";

  // ポップアップや別タブを使わず、現在の在庫アプリ内にカメラ画面を表示
  qrCameraOverlay = document.createElement("div");
  qrCameraOverlay.id = "qrCameraOverlay";
  qrCameraOverlay.style.cssText =
    "position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.94);" +
    "display:flex;flex-direction:column;align-items:center;justify-content:center;" +
    "padding:18px;box-sizing:border-box;";

  const title = document.createElement("div");
  title.textContent = "QRコードを枠内に映してください";
  title.style.cssText =
    "color:white;font-size:18px;font-weight:bold;text-align:center;margin:0 0 14px;";

  const reader = document.createElement("div");
  reader.id = "qrLiveReader";
  reader.style.cssText =
    "width:min(92vw,420px);min-height:260px;background:#111;border-radius:12px;overflow:hidden;";

  const closeBtn = document.createElement("button");
  closeBtn.type = "button";
  closeBtn.textContent = "閉じる";
  closeBtn.style.cssText =
    "margin-top:18px;min-height:48px;width:min(92vw,420px);border:0;border-radius:10px;" +
    "background:#ef4444;color:white;font-size:18px;font-weight:bold;";
  closeBtn.addEventListener("click", closeQRScanner);

  qrCameraOverlay.appendChild(title);
  qrCameraOverlay.appendChild(reader);
  qrCameraOverlay.appendChild(closeBtn);
  document.body.appendChild(qrCameraOverlay);

  try {
    const scanner = new Html5Qrcode("qrLiveReader");
    liveQrScanner = scanner;

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: (w, h) => {
          const size = Math.floor(Math.min(w, h, 280));
          return { width: size, height: size };
        },
        aspectRatio: 1.0
      },
      async (decodedText) => {
        const decoded = String(decodedText || "").trim();
        if (!decoded || !liveQrScanner) return;

        // 二重読み取りを防いでカメラを停止
        const completedScanner = liveQrScanner;
        liveQrScanner = null;
        try { await completedScanner.stop(); } catch (e) {}
        try { completedScanner.clear(); } catch (e) {}

        if (qrCameraOverlay) {
          qrCameraOverlay.remove();
          qrCameraOverlay = null;
        }
        qrStarting = false;
        cameraBtn.innerText = "📷 QR読み込み";

        // 既存のQR検索処理へ渡す
        QR_SEARCH = decoded;
        document.getElementById("supplier").value = "";
        document.getElementById("jump").value = "";
        document.getElementById("keyword").value = "";
        updateProducts();
        render();
        window.scrollTo(0, 0);
      },
      () => {
        // QRが映っていない間の解析エラーは通常動作なので表示しない
      }
    );

    qrStarting = false;
    cameraBtn.innerText = "📷 読み取り中（閉じる時は下のボタン）";
  } catch (err) {
    console.error("QR camera start error:", err);
    closeQRScanner();
    const message = String(err && (err.message || err.name) || err);
    if (/NotAllowedError|PermissionDeniedError|denied|permission/i.test(message)) {
      alert("カメラを使用できませんでした。iPhoneの設定で、このWebアプリのカメラ使用を許可してください。");
    } else if (/NotFoundError|DevicesNotFoundError/i.test(message)) {
      alert("利用できるカメラが見つかりませんでした。");
    } else {
      alert("カメラを起動できませんでした。\n" + message + "\n在庫アプリを閉じて開き直し、もう一度お試しください。");
    }
  }
}

// =====================
// 商品名ライブスキャン（無料OCR）
// QRスキャンとは独立して動作。OCR結果を既存キーワード検索へ渡す。
// =====================
let textScanStream = null;
let textScanWorker = null;
let textScanBusy = false;
let textScanActive = false;
let textScanLast = "";
let textScanHistory = [];
let textScanTimer = null;
let lastOcrImageDataUrl = "";
let aiOcrBusy = false;
let aiOcrFirstFrameDone = false;

async function getTextOcrWorker() {
  if (textScanWorker) return textScanWorker;
  if (!window.Tesseract) throw new Error("文字認識ライブラリを読み込めませんでした。通信状態を確認してください。");
  const status = document.getElementById("ocrStatus");
  status.textContent = "日本語の文字認識データを準備しています（初回のみ時間がかかります）…";
  textScanWorker = await Tesseract.createWorker("jpn+eng", 1, {
    logger: m => {
      if (m.status === "recognizing text") status.textContent = `文字を認識中… ${Math.round((m.progress || 0) * 100)}%`;
      else if (m.status) status.textContent = "準備中：" + m.status;
    }
  });
  // 商品ラベル内の複数行テキストを読みやすくする設定
  await textScanWorker.setParameters({
    tessedit_pageseg_mode: "6",
    preserve_interword_spaces: "1"
  });
  return textScanWorker;
}

function closeTextScan() {
  textScanActive = false;
  textScanBusy = false;
  if (textScanTimer) { clearInterval(textScanTimer); textScanTimer = null; }
  if (textScanStream) {
    textScanStream.getTracks().forEach(track => track.stop());
    textScanStream = null;
  }
  const overlay = document.getElementById("ocrCameraOverlay");
  if (overlay) overlay.remove();
  const btn = document.getElementById("textScanBtn");
  if (btn) btn.textContent = "📷 商品写真を撮影してAI検索";
}

function ocrSimilarity(a, b) {
  const x = normalize(a || "");
  const y = normalize(b || "");
  if (!x || !y) return 0;
  if (x === y) return 1;
  const grams = value => {
    const out = new Set();
    if (value.length === 1) out.add(value);
    for (let i = 0; i < value.length - 1; i++) out.add(value.slice(i, i + 2));
    return out;
  };
  const ax = grams(x), by = grams(y);
  let same = 0;
  ax.forEach(v => { if (by.has(v)) same++; });
  return (2 * same) / (ax.size + by.size);
}

function getOcrProductCandidates(text) {
  const query = normalize(text);
  return DATA
    .map(item => {
      const label = [item.supplier, item.name, item.type, item.size, item.code]
        .filter(Boolean).join(" ");
      return { item, score: score(label, text) };
    })
    .filter(x => x.score > 0 || !query)
    .sort((a, b) => b.score - a.score)
    .slice(0, 20)
    .map(x => ({
      supplier: x.item.supplier || "",
      name: x.item.name || "",
      type: x.item.type || "",
      size: x.item.size || "",
      code: x.item.code || ""
    }));
}

async function requestAiOcr(imageDataUrl, ocrText) {
  const response = await fetch(AI_OCR_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({
      image: imageDataUrl,
      ocrText: ocrText || "",
      candidates: getOcrProductCandidates(ocrText || "")
    })
  });
  if (!response.ok) throw new Error("AI-OCR中継サーバー HTTP " + response.status);
  const result = await response.json();
  const corrected = String(result.correctedText || result.text || "").trim();
  if (!corrected) throw new Error("AIから認識結果が返りませんでした");
  return { ...result, correctedText: corrected };
}

function applyOcrResult(result, status) {
  const input = document.getElementById("ocrText");
  input.value = result.correctedText;
  status.textContent = result.matchedName
    ? "AI確認済み：" + result.matchedName
    : "AIで読み取り結果を補正しました。内容を確認してください。";
}

async function enhanceOcrWithAi() {
  if (aiOcrBusy) return;
  const input = document.getElementById("ocrText");
  const status = document.getElementById("ocrStatus");
  if (!lastOcrImageDataUrl) {
    status.textContent = "先にカメラで商品ラベルを読み取ってください。";
    return;
  }
  aiOcrBusy = true;
  const button = document.getElementById("ocrAiBtn");
  if (button) { button.disabled = true; button.textContent = "AIで確認中…"; }
  status.textContent = "Manus AIで画像と商品DBを照合しています…";
  try {
    const result = await requestAiOcr(lastOcrImageDataUrl, input.value.trim());
    applyOcrResult(result, status);
  } catch (error) {
    console.warn("AI OCR unavailable:", error);
    status.textContent = "AI確認を利用できません。従来OCRの結果を使用します。";
  } finally {
    aiOcrBusy = false;
    if (button) { button.disabled = false; button.textContent = "AIで精度を上げる"; }
  }
}

async function runTextOcr() {
  if (!textScanActive || textScanBusy) return;
  const video = document.getElementById("ocrVideo");
  const canvas = document.getElementById("ocrCanvas");
  if (!video || !canvas || video.readyState < 2 || !video.videoWidth) return;

  textScanBusy = true;
  try {
    // 画面中央を切り出して拡大。反射や背景をできるだけ減らす
    const sourceW = video.videoWidth;
    const sourceH = video.videoHeight;
    const cropW = Math.round(sourceW * 0.90);
    const cropH = Math.round(sourceH * 0.82);
    const cropX = Math.round((sourceW - cropW) / 2);
    const cropY = Math.round((sourceH - cropH) / 2);
    const scale = Math.min(2.2, 2000 / cropW);
    canvas.width = Math.max(1, Math.round(cropW * scale));
    canvas.height = Math.max(1, Math.round(cropH * scale));

    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);
    // AI-OCRボタンで送る最新フレーム。認証情報はブラウザへ置かない。
    lastOcrImageDataUrl = canvas.toDataURL("image/jpeg", 0.82);

    // 初回フレームはAIを最優先。AI中継が未設定・失敗の場合だけ下のTesseractへ進む。
    if (!aiOcrFirstFrameDone) {
      aiOcrFirstFrameDone = true;
      const aiStatus = document.getElementById("ocrStatus");
      aiStatus.textContent = "AIで商品画像を確認しています…";
      try {
        const aiResult = await requestAiOcr(lastOcrImageDataUrl, "");
        applyOcrResult(aiResult, aiStatus);
        textScanBusy = false;
        return;
      } catch (aiError) {
        console.warn("Initial AI OCR unavailable; fallback to Tesseract:", aiError);
        aiStatus.textContent = "AIに接続できないため、通常OCRへ切り替えています…";
      }
    }

    // まず階調を残した高コントラスト画像を作る
    const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const pixels = image.data;
    const histogram = new Array(256).fill(0);
    for (let i = 0; i < pixels.length; i += 4) {
      const gray = Math.max(0, Math.min(255,
        (0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2] - 128) * 1.55 + 128
      ));
      pixels[i] = pixels[i + 1] = pixels[i + 2] = gray;
      histogram[Math.round(gray)]++;
    }
    ctx.putImageData(image, 0, 0);

    // 2種類目：自動しきい値（二値化）。ビニールの反射がある場合の補助
    const total = canvas.width * canvas.height;
    let sum = 0;
    for (let i = 0; i < 256; i++) sum += i * histogram[i];
    let sumB = 0, weightB = 0, maxVariance = -1, threshold = 160;
    for (let i = 0; i < 256; i++) {
      weightB += histogram[i];
      if (!weightB) continue;
      const weightF = total - weightB;
      if (!weightF) break;
      sumB += i * histogram[i];
      const meanB = sumB / weightB;
      const meanF = (sum - sumB) / weightF;
      const variance = weightB * weightF * (meanB - meanF) * (meanB - meanF);
      if (variance > maxVariance) { maxVariance = variance; threshold = i; }
    }

    const binaryCanvas = document.createElement("canvas");
    binaryCanvas.width = canvas.width;
    binaryCanvas.height = canvas.height;
    const bctx = binaryCanvas.getContext("2d", { willReadFrequently: true });
    const binary = bctx.createImageData(canvas.width, canvas.height);
    for (let i = 0; i < pixels.length; i += 4) {
      const v = pixels[i] > threshold ? 255 : 0;
      binary.data[i] = binary.data[i + 1] = binary.data[i + 2] = v;
      binary.data[i + 3] = 255;
    }
    bctx.putImageData(binary, 0, 0);

    // ラベル中央部分を別に切り出す。商品名の大きな文字を優先して読む
    const labelCanvas = document.createElement("canvas");
    const labelX = Math.round(canvas.width * 0.08);
    const labelY = Math.round(canvas.height * 0.12);
    const labelW = Math.round(canvas.width * 0.84);
    const labelH = Math.round(canvas.height * 0.66);
    labelCanvas.width = labelW;
    labelCanvas.height = labelH;
    const labelCtx = labelCanvas.getContext("2d");
    labelCtx.imageSmoothingEnabled = true;
    labelCtx.imageSmoothingQuality = "high";
    labelCtx.drawImage(canvas, labelX, labelY, labelW, labelH, 0, 0, labelW, labelH);

    const worker = await getTextOcrWorker();
    const status = document.getElementById("ocrStatus");
    const candidates = [];

    // 3パターンで読み、文字のまとまりが良い結果を選ぶ
    await worker.setParameters({ tessedit_pageseg_mode: "6", preserve_interword_spaces: "1" });
    const fullResult = await worker.recognize(canvas);
    candidates.push({ result: fullResult, mode: "全体" });

    await worker.setParameters({ tessedit_pageseg_mode: "11", preserve_interword_spaces: "1" });
    const binaryResult = await worker.recognize(binaryCanvas);
    candidates.push({ result: binaryResult, mode: "白黒" });

    await worker.setParameters({ tessedit_pageseg_mode: "6", preserve_interword_spaces: "1" });
    const labelResult = await worker.recognize(labelCanvas);
    candidates.push({ result: labelResult, mode: "商品ラベル拡大" });

    const evaluated = candidates.map(candidate => {
      const data = candidate.result.data || {};
      const text = String(data.text || "")
        .replace(/[\r\n]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
      const compact = normalize(text);
      const japaneseCount = (text.match(/[ぁ-んァ-ヶ一-龠]/g) || []).length;
      const codeLikeCount = (text.match(/[A-Z]{1,5}[-ー]?\d{1,5}/gi) || []).length;
      const garbageCount = (text.match(/[|*_＝=<>←→]/g) || []).length;
      const confidence = Number(data.confidence) || 0;
      const quality = confidence
        + Math.min(japaneseCount, 16) * 1.8
        + Math.min(codeLikeCount, 3) * 2
        - garbageCount * 2.5
        - (compact.length < 3 ? 12 : 0);
      return { text, confidence, quality, mode: candidate.mode };
    }).filter(item => normalize(item.text).length >= 2);

    if (!evaluated.length) {
      status.textContent = "文字が見つかりません。ラベルを正面から大きく映してください。";
      return;
    }

    evaluated.sort((a, b) => b.quality - a.quality);
    const text = evaluated[0].text;
    const input = document.getElementById("ocrText");
    input.value = text;
    status.textContent = evaluated[0].mode + "の読み取り結果を確認中…";
    // フレーム間で似た結果が繰り返された場合だけ検索欄へ反映
    const current = normalize(text);
    textScanHistory.push(current);
    if (textScanHistory.length > 3) textScanHistory.shift();
    const stable = textScanHistory.some((value, index) =>
      index !== textScanHistory.length - 1 &&
      ocrSimilarity(value, current) >= 0.72
    );

    if (stable && current !== textScanLast) {
      textScanLast = current;
      const keyword = document.getElementById("keyword");
      keyword.value = text;
      QR_SEARCH = "";
      document.getElementById("supplier").value = "";
      document.getElementById("jump").value = "";
      updateProducts();
      render();
      status.textContent = "複数回の読み取りで似た結果を確認しました。検索に反映しました。";
    } else {
      status.textContent = "商品ラベル拡大を含む3方式で認識中… ラベルを固定してください。";
    }
  } catch (err) {
    console.error("OCR error:", err);
    const status = document.getElementById("ocrStatus");
    if (status) status.textContent = "文字認識でエラーが発生しました。明るさや通信状態を確認してください。";
  } finally {
    textScanBusy = false;
  }
}

let photoSelection = null;
let photoSelectionStart = null;

function drawPhotoSelection(x, y) {
  const box = document.getElementById("ocrPhotoSelection");
  if (!box || !photoSelectionStart) return;
  const left = Math.min(photoSelectionStart.x, x);
  const top = Math.min(photoSelectionStart.y, y);
  const width = Math.abs(x - photoSelectionStart.x);
  const height = Math.abs(y - photoSelectionStart.y);
  box.style.left = left + "px";
  box.style.top = top + "px";
  box.style.width = width + "px";
  box.style.height = height + "px";
  photoSelection = { left, top, width, height };
}

async function recognizeSelectedPhoto() {
  if (!photoSelection || photoSelection.width < 12 || photoSelection.height < 12) {
    alert("文字が入る範囲を指で囲んでください。");
    return;
  }
  const image = document.getElementById("ocrPhoto");
  const status = document.getElementById("ocrStatus");
  const button = document.getElementById("ocrExtractBtn");
  const rect = image.getBoundingClientRect();
  const scaleX = image.naturalWidth / rect.width;
  const scaleY = image.naturalHeight / rect.height;
  const sx = Math.max(0, photoSelection.left * scaleX);
  const sy = Math.max(0, photoSelection.top * scaleY);
  const sw = Math.min(image.naturalWidth - sx, photoSelection.width * scaleX);
  const sh = Math.min(image.naturalHeight - sy, photoSelection.height * scaleY);
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(sw));
  canvas.height = Math.max(1, Math.round(sh));
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(image, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  lastOcrImageDataUrl = canvas.toDataURL("image/jpeg", 0.92);
  button.disabled = true;
  button.textContent = "AIで文字抽出中…";
  status.textContent = "選択範囲をAIで読み取っています…";
  try {
    const result = await requestAiOcr(lastOcrImageDataUrl, "");
    applyOcrResult(result, status);
  } catch (aiError) {
    // AI中継が未設定でも、選択範囲だけをTesseractで読む。
    console.warn("Selected photo AI OCR unavailable; fallback to Tesseract:", aiError);
    try {
      const worker = await getTextOcrWorker();
      const result = await worker.recognize(canvas);
      const text = String(result.data && result.data.text || "").replace(/\s+/g, " ").trim();
      if (!text) throw new Error("文字が見つかりません");
      document.getElementById("ocrText").value = text;
      status.textContent = "選択範囲をOCRで読み取りました。内容を確認してください。";
    } catch (fallbackError) {
      console.error("Selected photo OCR error:", fallbackError);
      status.textContent = "文字を読み取れませんでした。文字を大きく囲んで再試行してください。";
    }
  } finally {
    button.disabled = false;
    button.textContent = "選択範囲をAIで文字抽出";
  }
}

function showPhotoSelection(dataUrl) {
  const overlay = document.getElementById("ocrCameraOverlay");
  overlay.innerHTML = `
    <div style="color:white;font-size:19px;font-weight:bold;text-align:center;">文字を指で囲んでください</div>
    <div id="ocrPhotoStage" style="position:relative;width:100%;max-width:520px;touch-action:none;user-select:none;">
      <img id="ocrPhoto" src="${dataUrl}" alt="撮影した商品写真" style="display:block;width:100%;max-height:62vh;object-fit:contain;background:#111;border-radius:10px;">
      <div id="ocrPhotoSelection" style="position:absolute;display:none;border:3px solid #34d399;background:rgba(52,211,153,.18);pointer-events:none;box-sizing:border-box;"></div>
    </div>
    <div id="ocrStatus">写真の上で、商品名・品番などを指でなぞって囲んでください。</div>
    <button id="ocrExtractBtn" style="background:#0f766e;color:white;width:100%;max-width:520px;min-height:52px;border:0;border-radius:10px;font-size:18px;font-weight:bold;">選択範囲をAIで文字抽出</button>
    <div style="width:100%;max-width:520px;color:white;font-size:14px;">抽出結果（必要なら修正できます）</div>
    <textarea id="ocrText" placeholder="選択した文字がここに表示されます"></textarea>
    <div style="display:flex;gap:10px;width:100%;max-width:520px;">
      <button id="ocrApplyBtn" style="flex:1;background:#2563eb;color:white;">この文字で検索</button>
      <button id="ocrCloseBtn" style="flex:1;background:#dc2626;color:white;">閉じる</button>
    </div>`;
  const stage = document.getElementById("ocrPhotoStage");
  const selectionBox = document.getElementById("ocrPhotoSelection");
  const point = event => {
    const r = stage.getBoundingClientRect();
    return { x: Math.max(0, Math.min(r.width, event.clientX - r.left)), y: Math.max(0, Math.min(r.height, event.clientY - r.top)) };
  };
  stage.addEventListener("pointerdown", event => {
    stage.setPointerCapture(event.pointerId);
    photoSelectionStart = point(event);
    selectionBox.style.display = "block";
    drawPhotoSelection(photoSelectionStart.x, photoSelectionStart.y);
  });
  stage.addEventListener("pointermove", event => {
    if (photoSelectionStart) { const p = point(event); drawPhotoSelection(p.x, p.y); }
  });
  stage.addEventListener("pointerup", event => {
    if (photoSelectionStart) { const p = point(event); drawPhotoSelection(p.x, p.y); photoSelectionStart = null; }
  });
  document.getElementById("ocrExtractBtn").addEventListener("click", recognizeSelectedPhoto);
  document.getElementById("ocrCloseBtn").addEventListener("click", closeTextScan);
  document.getElementById("ocrApplyBtn").addEventListener("click", () => {
    const text = document.getElementById("ocrText").value.trim();
    if (!text) { alert("先に文字を抽出してください。"); return; }
    document.getElementById("keyword").value = text;
    QR_SEARCH = "";
    document.getElementById("supplier").value = "";
    document.getElementById("jump").value = "";
    updateProducts();
    render();
    closeTextScan();
    window.scrollTo(0, 0);
  });
}

async function startTextScan() {
  if (textScanActive) { closeTextScan(); return; }
  const btn = document.getElementById("textScanBtn");
  const overlay = document.createElement("div");
  overlay.id = "ocrCameraOverlay";
  overlay.style.cssText = "position:fixed;inset:0;z-index:100001;background:rgba(0,0,0,.96);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:flex-start;padding:18px;box-sizing:border-box;overflow:auto;";
  overlay.innerHTML = `
    <div style="color:white;font-size:20px;font-weight:bold;text-align:center;">写真を撮影して、文字を指で囲んでください</div>
    <div id="ocrStatus">iPhoneのカメラを起動しています…</div>
  `;
  document.body.appendChild(overlay);
  textScanActive = true;
  btn.textContent = "📷 写真選択中（タップで終了）";
  const fileInput = document.getElementById("textPhotoFile");
  fileInput.value = "";
  fileInput.onchange = () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => showPhotoSelection(String(reader.result));
    reader.readAsDataURL(file);
  };
  fileInput.click();
}

// 起動
load();
