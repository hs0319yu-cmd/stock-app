<script>

let DATA = [];

// DB在庫の自動同期
let stockRefreshTimer = null;
let stockRefreshPromise = null;
const stockUpdatePending = new Set();

function formatStock(value){
  const n = Number(value);
  return Number.isFinite(n) ? Math.max(0, Math.floor(n)) : 0;
}

async function refreshStocksFromDB(force = false){
  // 定期同期中に更新処理が終わった場合は、その取得完了を待ってから再取得
  if (stockRefreshPromise) {
    const running = stockRefreshPromise;
    await running;
    if (!force) return;
  }

  const task = (async () => {
    const res = await fetch(GAS_URL + "?api=1&_ts=" + Date.now(), {
      cache: "no-store"
    });
    if (!res.ok) throw new Error("DB在庫の取得に失敗しました");
    const latest = await res.json();
    if (!Array.isArray(latest)) throw new Error("DBのデータ形式が正しくありません");

    // 行番号で照合し、同名商品でも別行の在庫を混同しない
    const stockByRow = new Map(
      latest.map(item => [String(item.row), formatStock(item.stock)])
    );

    DATA.forEach(item => {
      const key = String(item.row);

      // 更新ボタンを押して通信中の商品は、画面の仮表示を定期同期で戻さない。
      // force=true（更新処理の完了後）の場合だけDB確定値で上書きする。
      if (stockUpdatePending.has(key) && !force) return;

      if (stockByRow.has(key)) item.stock = stockByRow.get(key);
      const stockEl = document.getElementById("s" + item.row);
      if (stockEl && stockByRow.has(key)) {
        stockEl.innerHTML =
          '<span class="stock-label">DB在庫</span> ' + stockByRow.get(key);
      }
    });
  })();

  stockRefreshPromise = task;
  try {
    await task;
  } catch (err) {
    console.warn("DB在庫の同期に失敗:", err);
  } finally {
    if (stockRefreshPromise === task) stockRefreshPromise = null;
  }
}

function startStockAutoRefresh(){
  if (stockRefreshTimer) clearInterval(stockRefreshTimer);
  stockRefreshTimer = setInterval(() => {
    if (!document.hidden) refreshStocksFromDB();
  }, 3000);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) refreshStocksFromDB();
});
window.addEventListener("focus", () => refreshStocksFromDB());

let LAST_Y = 0;

// ←ここに置く
function restoreScroll(){
  window.scrollTo(0, LAST_Y);
}

function onFocusQty(row){
  LAST_Y = window.scrollY;
}

 const GAS_URL =
"https://script.google.com/macros/s/AKfycbwYBYPrPt6_-F6KJ0fBAl5mfRWzzvEi976jYX4-16Bw3NSbhtOVkgnTy__vqVPrdE8g/exec";

// QRで呼び出した検索文字列
let QR_SEARCH = "";

// QR解除
function clearQR(){

QR_SEARCH = "";

document.getElementById(
"cameraBtn"
).innerText =
"📷 QR読み込み";

}

// ★ここに全部まとめる（最上部）
function normalize(str){
  return String(str || "")
    .toLowerCase()
    .replace(/[^\p{L}\p{N}]+/gu, "")
    .replace(/[ぁ-ん]/g, s =>
      String.fromCharCode(s.charCodeAt(0) + 0x60)
    );
}

function tokenize(str){
  return normalize(str).match(/[\p{L}\p{N}]+/gu) || [];
}

function score(itemText, keyword){

  const text = normalize(itemText);
  const key = normalize(keyword);

  let score = 0;

  if (!key) return 1;

  // ① 完全一致
  if (text.includes(key)) {
    return 100;
  }

  // ② スライド部分一致（Amazonの核心）
  for (let i = 0; i < key.length - 1; i++) {

    const part = key.slice(i, i + 2); // 2文字単位

    if (text.includes(part)) {
      score += 10;
    }
  }

  // ③ 1文字でもヒット
  for (let c of key) {
    if (text.includes(c)) {
      score += 2;
    }
  }

  return score;
}

const supplier =

// データ取得

async function load(){

const res =
await fetch(
GAS_URL + "?api=1"
);

DATA =
await res.json();

/* 仕入先一覧 */
const supplierEl =
document.getElementById(
"supplier"

supplierEl.innerHTML =

[

startStockAutoRefresh();

// =====================
// 描画
// =====================
function render(){

  const supplier = document.getElementById("supplier").value;
  const product  = document.getElementById("jump").value;
  const keyword  = document.getElementById("keyword").value;

  let list = [];

  DATA.forEach(item => {

    if (supplier && item.supplier !== supplier) return;
    if (product && item.name !== product) return;

    
// QR表示中なら
// supplier|name|type 一致
if(QR_SEARCH){

const qr =
normalize(QR_SEARCH);

const target =
normalize(
(item.supplier || "") +
"|" +
(item.name || "") +
"|" +
(item.type || "")
);

console.log(
"QR=",
qr
);

console.log(
"TARGET=",
target
);

if(
target !== qr
){
return;
}

}


   const text = normalize(
  item.supplier +
  item.name +
  item.type +
  item.size +
  item.code
);

    const s = keyword ? score(text, keyword) : 1;

    if (keyword && s === 0) return;

    list.push({ item, score: s });
  });

  // ★重要：スコア順（Amazonの本体）
  list.sort((a,b) => b.score - a.score);

  let html = "";

  list.forEach(obj => {

    const item = obj.item;

  html += `
  <div class="card" id="item_${item.row}">

    <div class="name">${item.name}</div>

    <div class="type">${item.type || ""}</div>

    <div class="size">${item.size || ""}</div>

   <div class="stock" id="s${item.row}">
  <span class="stock-label">DB在庫</span> ${formatStock(item.stock)}
</div>

  <input
type="tel"
id="q${item.row}"
class="qty"
placeholder="${item.supplier || '仕入先なし'}"
onfocus="onFocusQty(${item.row})"
onblur="setTimeout(restoreScroll, 0)">


   <div class="btns">
  <button class="plus" onclick="chg(${item.row},1)">＋</button>
  <button class="minus" onclick="chg(${item.row},-1)">－</button>
</div>

  </div>
`;
  });

 document.getElementById("list").innerHTML = html;

/* ★ヘッダー高さ再計算 */
setTimeout(adjustHeader,0);
}

/* 検索窓のキーワード検索を解除 */
let searchTimer;

function clearKeywordSearch(){
  clearTimeout(searchTimer);
  const keywordEl = document.getElementById("keyword");
  if (keywordEl) keywordEl.value = "";
  QR_SEARCH = "";
  render();
}

function searchRender(){

  clearTimeout(searchTimer);

  searchTimer = setTimeout(()=>{

    const keyword =
      document.getElementById("keyword").value.trim();

    // ★検索開始したら「全体検索に戻す」
    if(keyword){

      document.getElementById("supplier").value = "";
      document.getElementById("jump").value = "";

      updateProducts();
    }

    render();
    window.scrollTo(0,0);

  },100);

}

// =====================
// 在庫変更
// =====================
async function chg(row,mode){

  const box = document.getElementById("q"+row);
  const qty = Number(box.value);
  if(!qty || qty <= 0) return;

  // 同じ商品を同じ端末から連打して二重送信しない
  const rowKey = String(row);
  if (stockUpdatePending.has(rowKey)) return;
  stockUpdatePending.add(rowKey);

  const diff = mode > 0 ? qty : -qty;
  const card = document.getElementById("item_" + row);
  const buttons = card ? card.querySelectorAll(".btns button") : [];
  const stockEl = document.getElementById("s"+row);

  // 画面は先に即時反映。DBの保存処理・同時更新対策は従来どおりサーバー側で行う。
  const item = DATA.find(v => String(v.row) === rowKey);
  const previousStock = item ? formatStock(item.stock) : null;
  const optimisticStock = previousStock === null
    ? null
    : Math.max(0, previousStock + diff);

  if (item && optimisticStock !== null) item.stock = optimisticStock;
  if (stockEl && optimisticStock !== null) {
    stockEl.innerHTML =
      '<span class="stock-label">DB在庫</span> ' + optimisticStock;
  }

  buttons.forEach(btn => {
    btn.disabled = true;
    btn.style.opacity = "0.55";
  });
  box.value = "";

  try {
    const response = await fetch(GAS_URL,{
      method:"POST",
      body:JSON.stringify({ row, diff })
    });
    const result = await response.json();
    if (!response.ok || !result || result.ok !== true ||
        Number(result.row) !== Number(row) ||
        !Number.isFinite(Number(result.stock))) {
      throw new Error((result && result.error) || "DBから確定在庫数が返りませんでした");
    }

    // GASがロック内で保存した直後の確定値を受け取り、追加のDB全件取得をしない
    const confirmedStock = formatStock(result.stock);
    if (item) item.stock = confirmedStock;
    if (stockEl) {
      stockEl.innerHTML =
        '<span class="stock-label">DB在庫</span> ' + confirmedStock;
    }
    box.blur();
  } catch (err) {
    console.error("在庫更新エラー:", err);
    alert("保存結果を受け取れませんでした。DBの確定在庫を再確認します。");
    await refreshStocksFromDB(true);
  } finally {
    stockUpdatePending.delete(rowKey);
    buttons.forEach(btn => {
      btn.disabled = false;
      btn.style.opacity = "";
    });
  }
}

/* =====================
   QR読取：在庫アプリ内でライブスキャン
   Safari / iPhoneホーム画面アプリ対応
   ===================== */

let liveQrScanner = null;
let qrCameraOverlay = null;
let qrStarting = false;

function closeQRScanner() {
  if (liveQrScanner) {
    const scanner = liveQrScanner;
    liveQrScanner = null;
    scanner.stop().catch(() => {}).finally(() => {
      try { scanner.clear(); } catch (e) {}
    });
  }
  if (qrCameraOverlay) {
    qrCameraOverlay.remove();
    qrCameraOverlay = null;
  }
  qrStarting = false;
  const cameraBtn = document.getElementById("cameraBtn");
  if (cameraBtn) cameraBtn.innerText = "📷 QR読み込み";
}

async function scanQR() {
  const cameraBtn = document.getElementById("cameraBtn");

  if (qrStarting || liveQrScanner) return;
  if (typeof Html5Qrcode === "undefined") {
    alert("QR読み取りライブラリを読み込めませんでした。通信状態を確認して、もう一度お試しください。");
    return;
  }

  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert("この画面ではカメラを起動できません。https:// で開いていることを確認してください。");
    return;
  }

  qrStarting = true;
  cameraBtn.innerText = "📷 カメラ起動中…";

  // ポップアップや別タブを使わず、現在の在庫アプリ内にカメラ画面を表示
  qrCameraOverlay = document.createElement("div");
  qrCameraOverlay.id = "qrCameraOverlay";
  qrCameraOverlay.style.cssText =
    "position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.94);" +
    "display:flex;flex-direction:column;align-items:center;justify-content:center;" +
    "padding:18px;box-sizing:border-box;";

  const title = document.createElement("div");
  title.textContent = "QRコードを枠内に映してください";
  title.style.cssText =
    "color:white;font-size:18px;font-weight:bold;text-align:center;margin:0 0 14px;";

  const reader = document.createElement("div");
  reader.id = "qrLiveReader";
  reader.style.cssText =
    "width:min(92vw,420px);min-height:260px;background:#111;border-radius:12px;overflow:hidden;";

  const closeBtn = document.createElement("button");
  closeBtn.type = "button";
  closeBtn.textContent = "閉じる";
  closeBtn.style.cssText =
    "margin-top:18px;min-height:48px;width:min(92vw,420px);border:0;border-radius:10px;" +
    "background:#ef4444;color:white;font-size:18px;font-weight:bold;";
  closeBtn.addEventListener("click", closeQRScanner);

  qrCameraOverlay.appendChild(title);
  qrCameraOverlay.appendChild(reader);
  qrCameraOverlay.appendChild(closeBtn);
  document.body.appendChild(qrCameraOverlay);

  try {
    const scanner = new Html5Qrcode("qrLiveReader");
    liveQrScanner = scanner;

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: (w, h) => {
          const size = Math.floor(Math.min(w, h, 280));
          return { width: size, height: size };
        },
        aspectRatio: 1.0
      },
      async (decodedText) => {
        const decoded = String(decodedText || "").trim();
        if (!decoded || !liveQrScanner) return;

        // 二重読み取りを防いでカメラを停止
        const completedScanner = liveQrScanner;
        liveQrScanner = null;
        try { await completedScanner.stop(); } catch (e) {}
        try { completedScanner.clear(); } catch (e) {}

        if (qrCameraOverlay) {
          qrCameraOverlay.remove();
          qrCameraOverlay = null;
        }
        qrStarting = false;
        cameraBtn.innerText = "📷 QR読み込み";

        // 既存のQR検索処理へ渡す
        QR_SEARCH = decoded;
        document.getElementById("supplier").value = "";
        document.getElementById("jump").value = "";
        document.getElementById("keyword").value = "";
        updateProducts();
        render();
        window.scrollTo(0, 0);
      },
      () => {
        // QRが映っていない間の解析エラーは通常動作なので表示しない
      }
    );

    qrStarting = false;
    cameraBtn.innerText = "📷 読み取り中（閉じる時は下のボタン）";
  } catch (err) {
    console.error("QR camera start error:", err);
    closeQRScanner();
    const message = String(err && (err.message || err.name) || err);
    if (/NotAllowedError|PermissionDeniedError|denied|permission/i.test(message)) {
      alert("カメラを使用できませんでした。iPhoneの設定で、このWebアプリのカメラ使用を許可してください。");
    } else if (/NotFoundError|DevicesNotFoundError/i.test(message)) {
      alert("利用できるカメラが見つかりませんでした。");
    } else {
      alert("カメラを起動できませんでした。\n" + message + "\n在庫アプリを閉じて開き直し、もう一度お試しください。");
    }
  }
}

// 起動
load();


</script>

</body>
</html>
