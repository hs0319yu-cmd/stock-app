<style>

body{
font-family:sans-serif;

#topBtn{

right:20px;
bottom:20px;
width:110px;

border:none;
border-radius:50%;
font-size:40px;
font-weight:bold;

color:white;
box-shadow:0 4px 12px rgba(0,0,0,.3);

grid-template-columns:1fr 1fr;
gap:8px;

height:100px;
font-size:48px;

border-radius:12px;

  background:#10b981;
  color:white;
}

.minus{
  background:#ef4444;
  color:white;
}
.type{
 font-size:64px;
font-weight:900;
  color:#7c3aed;
}

.size{
  font-size:64px;
font-weight:900;
  color:#ff0000;
}
#cameraBtn{
  width:100%;
  height:100px;
  font-size:48px;
  font-weight:bold;
  background:#f59e0b;
  color:white;
  border:none;
  border-radius:14px;

#reader{
display:none;

position:fixed;
top:200px;

left:50%;
transform:translateX(-50%);

width:300px;
height:300px;

z-index:9999;
background:black;
}

#reader video{

height:300px !important;
object-fit:cover !important;
}

/* iPhone文字勝手拡大防止 */
html{
-webkit-text-size-adjust:100%;
}
/* =====================
スマホだけ元サイズへ戻す
===================== */
@media screen and (max-width:768px){

html{
  -webkit-text-size-adjust:none;
}

body{
  overflow-x:hidden;
}

.topbar{
  padding:6px;
}

/* 上部 */
select,
#cameraBtn,
#keyword{
  height:48px !important;
  font-size:16px !important;
  margin-bottom:6px;
  border-radius:8px;
}

#keyword{
  padding:0 10px;
}

/* 商品カード */
.card{
  margin:6px;
  padding:10px;
  border-radius:10px;
}

/* 商品名 */
.name{
  font-size:28px !important;
  font-weight:900;
  line-height:1.3 !important;
  margin-bottom:6px;
}

/* 色・種類 */
.type{
 font-size:24px !important;
  font-weight:900;
  line-height:1.2;
}

/* サイズ */
.size{
  font-size:30px !important;
  font-weight:900;
  margin-top:2px;
  line-height:1.2;
}

/* 在庫 */
.stock{
  font-size:40px !important;
  font-weight:900 !important;

  margin:8px 0;

  line-height:1.1;
}

/* 数量 */
.qty{
  height:44px !important;   /* 今の高さ維持 */
  font-size:34px !important; /* 数字だけ大きく */
  font-weight:900 !important;

  padding:0 10px !important;

  margin-bottom:8px;
}

/* ± */
.btns{
  gap:6px;
}

.btns button{
  height:40px !important;
  font-size:22px !important;
}

/* ↑ */
#topBtn{
  width:42px !important;
  height:42px !important;
  right:8px;
  bottom:8px;
  font-size:18px !important;
}

}
body{
  margin:0;
}

#list{
  margin-top:0;
}

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:999;
  background:white;

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>

<body>

<div class="topbar">

 

<select id="supplier"
onchange="
clearQR();
updateProducts();
render();
">
<option value="">全商品検索</option>
</select>

<select id="jump"
onchange="
QR_SEARCH='';
render();
">
<option value="">商品</option>
</select>
<button
id="cameraBtn"
onclick="scanQR()">
📷 QR読み込み
</button>

<input
id="qrFile"
type="file"
accept="image/*"
capture="environment"
style="display:none;">

 <input
type="text"
id="keyword"
placeholder="キーワード検索"
oninput="searchRender()"
onfocus="
QR_SEARCH='';
document.getElementById('cameraBtn').innerText='📷 QR読み込み';

document.getElementById('supplier').value='';
document.getElementById('jump').value='';

updateProducts();
render();

zoomOn();
"
onblur="zoomOff()">

</div>

<div id="reader"></div>
<div id="list"></div>


<button id="topBtn" onclick="goTop()">↑</button>

<script>

let DATA = [];

let LAST_Y = 0;

// ←ここに置く
function restoreScroll(){
  window.scrollTo(0, LAST_Y);
}

function onFocusQty(row){
  LAST_Y = window.scrollY;
}

 const GAS_URL =
"https://script.google.com/macros/s/AKfycbwYBYPrPt6_-F6KJ0fBAl5mfRWzzvEi976jYX4-16Bw3NSbhtOVkgnTy__vqVPrdE8g/exec";

// QRで呼び出した検索文字列
let QR_SEARCH = "";

// QR解除
function clearQR(){

QR_SEARCH = "";

document.getElementById(
"cameraBtn"
).innerText =
"📷 QR読み込み";

}

// ★ここに全部まとめる（最上部）
function normalize(str){
  return String(str || "")
    .toLowerCase()
    .replace(/[^\p{L}\p{N}]+/gu, "")
    .replace(/[ぁ-ん]/g, s =>
      String.fromCharCode(s.charCodeAt(0) + 0x60)
    );
}

function tokenize(str){
  return normalize(str).match(/[\p{L}\p{N}]+/gu) || [];
}

function score(itemText, keyword){

  const text = normalize(itemText);
  const key = normalize(keyword);

  let score = 0;

  if (!key) return 1;

  // ① 完全一致
  if (text.includes(key)) {
    return 100;
  }

  // ② スライド部分一致（Amazonの核心）
  for (let i = 0; i < key.length - 1; i++) {

    const part = key.slice(i, i + 2); // 2文字単位

    if (text.includes(part)) {
      score += 10;
    }
  }

  // ③ 1文字でもヒット
  for (let c of key) {
    if (text.includes(c)) {
      score += 2;
    }
  }

  return score;
}
// =====================
// 商品select更新
// =====================
function updateProducts(){

const supplier =
document.getElementById(
"supplier"
).value;

// 商品一覧生成
const names =
[
...new Set(

DATA
.filter(item=>

!supplier ||

item.supplier === supplier

)
.map(item=>

item.name

)
.filter(Boolean)

)
];

document.getElementById(
"jump"
).innerHTML =

'<option value="">商品</option>' +

names
.map(v=>

`<option value="${v}">
${v}
</option>`

)
.join("");

}

function adjustHeader(){

  const topbar =
    document.querySelector(".topbar");

  const h =
    topbar.getBoundingClientRect().height;

  document.getElementById("list")
    .style.marginTop =
      (h + 25) + "px";
}
window.addEventListener(
  "load",
  adjustHeader
);

window.addEventListener(
  "resize",
  adjustHeader
);
// =====================
// データ取得
// =====================
async function load(){

const res =
await fetch(
GAS_URL + "?api=1"
);

DATA =
await res.json();

/* 仕入先一覧 */
const supplierEl =
document.getElementById(
"supplier"
);

supplierEl.innerHTML =

'<option value="">全商品検索</option>' +

[
...new Set(
DATA
.map(v=>v.supplier)
.filter(Boolean)
)
]
.map(v=>

`<option value="${v}">
${v}
</option>`

)
.join("");

/* 商品一覧更新 */
updateProducts();

/* 初回表示 */
render();

/* ★ヘッダー高さ調整 */
setTimeout(adjustHeader,100);

}
// =====================
// 描画
// =====================
function render(){

  const supplier = document.getElementById("supplier").value;
  const product  = document.getElementById("jump").value;
  const keyword  = document.getElementById("keyword").value;

  let list = [];

  DATA.forEach(item => {

    if (supplier && item.supplier !== supplier) return;
    if (product && item.name !== product) return;

    
// QR表示中なら
// supplier|name|type 一致
if(QR_SEARCH){

const qr =
normalize(QR_SEARCH);

const target =
normalize(
(item.supplier || "") +
"|" +
(item.name || "") +
"|" +
(item.type || "")
);

console.log(
"QR=",
qr
);

console.log(
"TARGET=",
target
);

if(
target !== qr
){
return;
}

}


   const text = normalize(
  item.supplier +
  item.name +
  item.type +
  item.size +
  item.code
);

    const s = keyword ? score(text, keyword) : 1;

    if (keyword && s === 0) return;

    list.push({ item, score: s });
  });

  // ★重要：スコア順（Amazonの本体）
  list.sort((a,b) => b.score - a.score);

  let html = "";

  list.forEach(obj => {

    const item = obj.item;

  html += `
  <div class="card" id="item_${item.row}">

    <div class="name">${item.name}</div>

    <div class="type">${item.type || ""}</div>

    <div class="size">${item.size || ""}</div>

   <div class="stock" id="s${item.row}">
  0
</div>

  <input
type="tel"
id="q${item.row}"
class="qty"
placeholder="${item.supplier || '仕入先なし'}"
onfocus="onFocusQty(${item.row})"
onblur="setTimeout(restoreScroll, 0)">


   <div class="btns">
  <button class="plus" onclick="chg(${item.row},1)">＋</button>
  <button class="minus" onclick="chg(${item.row},-1)">－</button>
</div>

  </div>
`;
  });

 document.getElementById("list").innerHTML = html;

/* ★ヘッダー高さ再計算 */
setTimeout(adjustHeader,0);
}

/* ←ここに追加 */
let searchTimer;

function searchRender(){

  clearTimeout(searchTimer);

  searchTimer = setTimeout(()=>{

    const keyword =
      document.getElementById("keyword").value.trim();

    // ★検索開始したら「全体検索に戻す」
    if(keyword){

      document.getElementById("supplier").value = "";
      document.getElementById("jump").value = "";

      updateProducts();
    }

    render();
    window.scrollTo(0,0);

  },100);

}

// =====================
// 在庫変更
// =====================
async function chg(row,mode){

  const box = document.getElementById("q"+row);
  const qty = Number(box.value);

  if(!qty || qty <= 0) return;

  const diff = mode > 0 ? qty : -qty;

  const stockEl = document.getElementById("s"+row);

  let current = Number(stockEl.innerText) || 0;

  current += diff;
  if(current < 0) current = 0;

  stockEl.innerText = current;

  box.value = "";

  await fetch(GAS_URL,{
    method:"POST",
    body:JSON.stringify({ row, diff })
  });

  box.blur();
}


// =====================
// 上へ
// =====================
function goTop(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

// =====================
// ズーム制御
// =====================
function zoomOn(){

  document
  .querySelector('meta[name="viewport"]')
  .setAttribute(
    "content",
    "width=device-width,initial-scale=1"
  );

}

function zoomOff(){

  document
  .querySelector('meta[name="viewport"]')
  .setAttribute(
    "content",
    "width=device-width,initial-scale=1,maximum-scale=1"
  );

}


/* =====================
   QR読取：外部HTTPSスキャナー連携
   ===================== */

let qrScannerWindow = null;
let qrScannerToken = "";

function scanQR() {
  const cameraBtn = document.getElementById("cameraBtn");

  // 既にスキャナーが開いている場合はそちらを前面へ
  try {
    if (qrScannerWindow && !qrScannerWindow.closed) {
      qrScannerWindow.focus();
      return;
    }
  } catch (e) {
    qrScannerWindow = null;
  }

  qrScannerToken =
    Date.now().toString(36) +
    Math.random().toString(36).slice(2);

  const scannerUrl =
    "https://hs0319yu-cmd.github.io/qr-scanner/" +
    "?token=" + encodeURIComponent(qrScannerToken);

  // iPhoneのホーム画面Webアプリでは名前付きwindow.openが
  // 開かないことがあるため、_blankで開く
  try {
    qrScannerWindow = window.open(scannerUrl, "_blank");
  } catch (e) {
    qrScannerWindow = null;
  }

  if (!qrScannerWindow) {
    // ポップアップがブロックされた場合に、ユーザー自身のタップで開けるリンクを表示
    let fallback = document.getElementById("qrOpenFallback");

    if (!fallback) {
      fallback = document.createElement("a");
      fallback.id = "qrOpenFallback";
      fallback.textContent = "QRスキャナーを開く";
      fallback.href = scannerUrl;
      fallback.target = "_blank";
      fallback.rel = "noopener";
      fallback.style.cssText =
        "display:block;margin:10px;padding:16px;background:#2563eb;" +
        "color:white;text-align:center;font-size:20px;font-weight:bold;" +
        "border-radius:12px;text-decoration:none;";
      cameraBtn.insertAdjacentElement("afterend", fallback);
    } else {
      fallback.href = scannerUrl;
      fallback.style.display = "block";
    }

    alert(
      "QRスキャナーを自動で開けませんでした。\n" +
      "表示された「QRスキャナーを開く」をもう一度タップしてください。"
    );
    return;
  }

  const fallback = document.getElementById("qrOpenFallback");
  if (fallback) fallback.style.display = "none";

  cameraBtn.innerText = "📷 QR読み取り中";
}

// 外部スキャナーからの読み取り結果を受信
window.addEventListener("message", function(event) {
  // GitHub Pagesからのメッセージだけを受け付ける
  if (event.origin !== "https://hs0319yu-cmd.github.io") {
    return;
  }

  // 今回開いたスキャナーからのメッセージだけを受け付ける
  if (!qrScannerWindow || event.source !== qrScannerWindow) {
    return;
  }

  const data = event.data;

  if (!data || data.type !== "INVENTORY_QR_RESULT") {
    return;
  }

  // 別の起動時の結果を誤って受け取らない
  if (data.token !== qrScannerToken) {
    return;
  }

  const decoded = String(data.value || "").trim();

  if (!decoded) {
    alert("QRコードの内容が空でした。もう一度読み取ってください。");
    return;
  }

  // 既存アプリの検索処理へ渡す
  QR_SEARCH = decoded;

  document.getElementById("cameraBtn").innerText =
    "📷 QR読み込み";

  document.getElementById("supplier").value = "";
  document.getElementById("jump").value = "";
  document.getElementById("keyword").value = "";

  updateProducts();
  render();
  window.scrollTo(0, 0);

  qrScannerWindow = null;
  qrScannerToken = "";
});


// 起動
load();


</script>

</body>
</html>
